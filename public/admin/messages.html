<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">
  <link rel="icon" href="/favicon.ico">

  <base href="">

  <title>Vvveb - Messages</title>

  <link href="css/admin.css" rel="stylesheet">
</head>


<body class="messages">

  <div id="container">

    <aside class="sidebar" data-v-copy-from="index.html,.sidebar"></aside>

    <main>

      <header class="clearfix top-header" data-v-copy-from="index.html,.top-header">

      </header>

      <form id="settings-form" action="" method="post" class="settings">
        <input type="hidden" name="action" id="action" value="save">
        <input type="hidden" name="csrf" data-v-csrf>
		
        <header class="actions">
          <div class="title">
            <h4 class="text-muted mt-2">
              <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#mail"></use></svg>
              Messages
            </h4>
          </div>
          <div class="btns">
		<a href="{$this.adminPath}index.php?module=plugins/contact-form/messages&action=csv" data-v-export-url title="Export as csv" class="btn btn-outline-secondary pe-3 ms-2">
              <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#download"></use></svg>
              <span>Export as csv</span>
            </a>
          </div>
        </header>
        <div>
          <section id="main-content">

         	<div class="notifications" data-v-notifications data-v-copy-from="index.html,.notifications"></div>

            <section class="content clearfix settings">

			<div class="bulk-actions px-2 mb-2" style="display:none">
				<!--
			   <button type="button" data-bs-toggle="collapse" href="#filters" aria-expanded="false"
						aria-controls="filters" title="Edit selected"
						class="btn btn-primary btn-sm">
					<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#pencil"></use></svg> Edit selected
				</button>
				-->
			   <button type="submit" name="action" value="delete" aria-expanded="false" data-v-check-permission-delete
						title="Delete selected"
						class="btn btn-outline-secondary bg-body-tertiary text-danger">
						<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#trash"></use></svg> Delete selected
				</button>
			
			</div>	

			<div class="table-responsive">
                <table class="table table-hover middle-align" data-v-messages>


                  <thead>
                    <tr>
                      <th class="col-cb">
                        <div class="checkbox_outer">

                          <label class="form-check">
                            <input type="checkbox" class="form-check-input" value="4" name="message[]" data-v-vvveb-action="table.bulkSelect">
                            <span class="form-check-label"></span>
                            <span class="custom-control-description">&nbsp;</span>
                          </label>


                        </div>
                      </th>
					  
					  <th style="width:200px;text-align:center;">
                        <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#photo"></use></svg><span>Name</span>
                      </th>
                                            
                      <th class="message">
                        <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#box"></use></svg><span>Subject</span>
                      </th>                      
    
                      <th class="message">
                        <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#box"></use></svg><span>Email</span>
                      </th>
                      <th class="message">
                        <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#box"></use></svg><span>First name</span>
                      </th>
                      
					  <th class="message">
                        <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#box"></use></svg><span>Last name</span>
					  </th>

					  <th class="message">
                        <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#box"></use></svg><span>Date added</span>
					  </th>

                      <th class="actions text-center" style="width:150px">
                        <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#edit"></use></svg><span>Actions</span>
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="message" data-v-message data-v-class-if-active="message.status=0">
                      <td class="checkbox">
                        <label class="form-check">
                          <input type="checkbox" class="form-check-input" value="4" name="message_id[]" data-v-vvveb-action="table.selectRow" data-v-message-message_id>
                          <span class="form-check-label"></span>
                          <span class="custom-control-description">&nbsp;</span>
                        </label>

                      </td>

                      <td class="img" style="width:200px;text-align:center;">
                        <a href="/admin?module=products&amp;action=product&amp;id=4" data-v-message-edit-url>
                          <span data-v-message-type>Type</span>
                        </a>
                      </td>

                      <td>
						  <a href="/admin?module=products&amp;action=product&amp;id=4" data-v-message-edit-url>
                          <span data-v-message-subject>Data</span>
                          </a>
                      </td>

                      <td>
                          <span data-v-message-email>Email</span>
                          <span data-v-message-mail>Mail</span>
                      </td>
                      <td>
                          <span data-v-message-firstname>First name</span>
                          <span data-v-message-first_name>First name</span>
						  <span data-v-message-name>Name</span>
                      </td>
                      <td>
                          <span data-v-message-lastname>Last name</span>
                          <span data-v-message-last_name>Last name</span>
                      </td>
						<td>
						  <span data-v-message-updated_at data-filter-friendly_date title="{$message.created_at}">Date</span>
                      </td>

                      <td class="actions" style="min-width:200px">

                        <div class="btn-group">
                          <a class="btn btn-icon btn-outline-secondary" data-v-message-edit-url>
                            <svg class="svg-icon text-primary" aria-hidden="true"><use href="/admin/default/img/icons.svg#pencil"></use></svg>
                            <span>View</span>
                          </a>

                          <button type="button" class="btn btn-icon btn-outline-secondary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false" data-bs-reference="parent">

                            <span class="visually-hidden">Toggle primary</span>
                          </button>
                          <ul class="dropdown-menu">
							  <li data-v-check-permission-delete>
								<button type="submit" name="message_id[]" value="" aria-expanded="false" class="dropdown-item text-danger" onclick="document.getElementById('action').value='delete';return confirm('Are you sure?')" data-v-message-message_id>							
									<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#trash"></use></svg><span>Delete</span>
								</button>
                            </li>
                          </ul>
                        </div>

                      </td>
                    </tr>
					<tr data-v-if-not="this.count > 0" class="no-items">
						<td colspan="100">
							<div class="text-center m-4">
								<div>
									<svg class="svg-icon display-6 lh-1 text-secondary text-opacity-50" aria-hidden="true"><use href="/admin/default/img/icons.svg#mail"></use></svg>
									<div class="mt-3 text-secondary">No messages to display!</div>
								</div>
							</div>
						</td>
					</tr>
                  </tbody>
                </table>
                
                <div class="d-flex justify-content-end ">
					<div id="pagination" data-v-pagination data-v-copy-from="content/posts.html,#pagination"></div>
                </div>
              </div>
                  
            </section>
          </section>
      </form>

    </div>
  
	 <footer id="main-footer" data-v-copy-from="index.html,#main-footer"></footer>
  </main>


  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script id="admin-js" type="module" src="/js/admin.js"></script>

</body>
</html>
